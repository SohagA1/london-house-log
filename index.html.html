<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>London House Equipment Sign Out/In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">London House Equipment</h1>

    <!-- Mode Selection Buttons -->
    <div id="selection-screen" class="space-y-4">
      <div class="flex gap-4">
        <button onclick="selectMode('SIGN OUT')" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-6 px-4 rounded-xl text-lg shadow transition">
          SIGN OUT
        </button>
        <button onclick="selectMode('SIGN IN')" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-6 px-4 rounded-xl text-lg shadow transition">
          SIGN IN
        </button>
      </div>
    </div>

    <!-- Form Screen -->
    <form id="borrow-form" onsubmit="handleSubmit(event)" class="hidden space-y-4 mt-4">
      <div class="flex items-center justify-between border-b pb-2 mb-4">
        <h2 id="form-title" class="text-xl font-bold text-gray-800"></h2>
        <button type="button" onclick="resetForm()" class="text-sm text-gray-500 hover:text-gray-800 underline">Change</button>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">What are you taking / returning?</label>
        <textarea id="item" required rows="2" placeholder="e.g., Hoover 1, Screwdriver, Cycle Pump, Cleaning Kit..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input id="name" type="text" required placeholder="Your Full Name" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Room Number</label>
        <input id="room" type="text" required placeholder="e.g., 2353" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <button id="submit-btn" type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 transition">
        Submit
      </button>
    </form>

    <!-- Success Message Screen -->
    <div id="success-screen" class="hidden text-center py-8 space-y-4">
      <div class="text-emerald-500 text-5xl">✓</div>
      <h2 id="success-title" class="text-2xl font-bold text-gray-800"></h2>
      <p id="success-message" class="text-gray-600 font-medium"></p>
      <button onclick="resetForm()" class="mt-4 bg-gray-800 text-white font-semibold py-2 px-6 rounded-lg">Done</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";
    let selectedAction = "";

    function selectMode(action) {
      selectedAction = action;
      document.getElementById("selection-screen").classList.add("hidden");
      document.getElementById("borrow-form").classList.remove("hidden");
      document.getElementById("form-title").innerText = action;
      
      const btn = document.getElementById("submit-btn");
      if (action === 'SIGN OUT') {
        btn.className = "w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 transition";
      } else {
        btn.className = "w-full bg-emerald-600 text-white font-bold py-3 rounded-lg shadow hover:bg-emerald-700 transition";
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.innerText = "Submitting...";

      const payload = {
        actionType: "SUBMIT",
        action: selectedAction,
        item: document.getElementById("item").value,
        name: document.getElementById("name").value,
        room: document.getElementById("room").value,
        status: selectedAction === "SIGN OUT" ? "OUT" : "RETURNED"
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        document.getElementById("borrow-form").classList.add("hidden");
        document.getElementById("success-screen").classList.remove("hidden");

        if (selectedAction === "SIGN OUT") {
          document.getElementById("success-title").innerText = "Signed Out Successfully!";
          document.getElementById("success-message").innerText = "Please return the item as soon as you are finished.";
        } else {
          document.getElementById("success-title").innerText = "Returned Successfully!";
          document.getElementById("success-message").innerText = "Item returned. Thank you!";
        }
      } catch (err) {
        alert("Error submitting form. Please try again.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Submit";
      }
    }

    function resetForm() {
      document.getElementById("borrow-form").reset();
      document.getElementById("borrow-form").classList.add("hidden");
      document.getElementById("success-screen").classList.add("hidden");
      document.getElementById("selection-screen").classList.remove("hidden");
    }
  </script>
</body>
</html>
